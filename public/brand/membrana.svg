<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-label="Schema della membrana AEM: gli ioni OH- attraversano la membrana dal lato anodo al lato catodo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eaf4ff"/>
      <stop offset="1" stop-color="#eafbf2"/>
    </linearGradient>
    <linearGradient id="mem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efe9d3"/>
      <stop offset="1" stop-color="#f8f4e7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#43b14a"/>
    </marker>
  </defs>

  <rect width="640" height="430" rx="16" fill="url(#bg)"/>

  <!-- Membrana ondulata centrale -->
  <path d="M300 18 C 332 110, 268 200, 322 300 C 352 356, 300 388, 322 412 L360 412 C 340 388, 388 340, 356 284 C 306 196, 366 120, 336 30 L336 18 Z" fill="url(#mem)" stroke="#dcd2b0" stroke-width="2"/>

  <!-- Etichette -->
  <text x="28" y="40" fill="#2f6fd0" font-family="system-ui, sans-serif" font-weight="700" font-size="20">LATO ANODO</text>
  <text x="28" y="62" fill="#6b7a90" font-family="system-ui, sans-serif" font-size="14">Ambiente alcalino</text>
  <text x="612" y="40" text-anchor="end" fill="#3aa64a" font-family="system-ui, sans-serif" font-weight="700" font-size="20">LATO CATODO</text>
  <text x="612" y="62" text-anchor="end" fill="#6b7a90" font-family="system-ui, sans-serif" font-size="14">Ambiente alcalino</text>

  <!-- Molecole d'acqua (lato anodo) -->
  <g fill="#3b8fd6">
    <g transform="translate(80,150)"><circle r="13"/><circle cx="-11" cy="-8" r="6" fill="#7fbfe8"/><circle cx="11" cy="-8" r="6" fill="#7fbfe8"/></g>
    <g transform="translate(150,220)"><circle r="13"/><circle cx="-11" cy="-8" r="6" fill="#7fbfe8"/><circle cx="11" cy="-8" r="6" fill="#7fbfe8"/></g>
    <g transform="translate(95,300)"><circle r="13"/><circle cx="-11" cy="-8" r="6" fill="#7fbfe8"/><circle cx="11" cy="-8" r="6" fill="#7fbfe8"/></g>
    <g transform="translate(185,120)"><circle r="10"/><circle cx="-9" cy="-6" r="5" fill="#7fbfe8"/><circle cx="9" cy="-6" r="5" fill="#7fbfe8"/></g>
    <g transform="translate(200,320)"><circle r="10"/><circle cx="-9" cy="-6" r="5" fill="#7fbfe8"/><circle cx="9" cy="-6" r="5" fill="#7fbfe8"/></g>
  </g>

  <!-- Ioni OH- che attraversano verso il catodo, con frecce -->
  <g font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">
    <path d="M370 140 L540 140" stroke="#43b14a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(400,140)"><circle r="16" fill="#43b14a"/><text y="5">OH⁻</text></g>
    <g transform="translate(505,140)"><circle r="16" fill="#43b14a"/><text y="5">OH⁻</text></g>

    <path d="M370 215 L540 215" stroke="#43b14a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(400,215)"><circle r="16" fill="#43b14a"/><text y="5">OH⁻</text></g>
    <g transform="translate(505,215)"><circle r="16" fill="#43b14a"/><text y="5">OH⁻</text></g>

    <path d="M370 290 L540 290" stroke="#43b14a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(400,290)"><circle r="16" fill="#43b14a"/><text y="5">OH⁻</text></g>
    <g transform="translate(505,290)"><circle r="16" fill="#43b14a"/><text y="5">OH⁻</text></g>
  </g>
</svg>
